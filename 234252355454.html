<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;

canvas{display:block;position:fixed;inset:0}
#panel{position:fixed;left:22px;top:22px;width:318px;background:rgba(10,10,12,.90);

#pbody{padding:14px 15px 16px}

.tile{background:rgba(255,255,255,.055);border-radius:9px;padding:8px 10px}

.tile .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.sec{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.42);

.sec:first-child{border-top:none;padding-top:0;margin-top:0}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:12px}
.row label{color:rgba(255,255,255,.80)}
.row .num{font-variant-numeric:tabular-nums;color:#F7931A;font-weight:600;font-size:11.5px}
input[type=range]{width:100%;-webkit-appearance:none;height:3px;border-radius:2px;
  background:rgba(255,255,255,.20);outline:none;margin-bottom:11px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#F7931A;cursor:pointer;box-shadow:0 0 9px rgba(247,147,26,.75)}
.sw{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;cursor:pointer}
.sw span{color:rgba(255,255,255,.80)}
.tr{width:34px;height:18px;border-radius:9px;background:rgba(255,255,255,.16);position:relative;transition:.18s;flex:none}
.tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;transition:.18s}
.sw.on .tr{background:rgba(247,147,26,.55)}
.sw.on .tr::after{left:18px;background:#F7931A}
#rail{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:20;display:flex;align-items:center}
#railBtns{display:flex;flex-direction:column;gap:7px;padding:9px 9px 9px 13px;
  background:rgba(10,10,12,.90);border:1px solid rgba(255,255,255,.13);border-right:none;
  border-radius:12px 0 0 12px;transform:translateX(calc(100% - 26px));transition:transform .25s ease}
#rail:hover #railBtns{transform:translateX(0)}
#railBtns a{width:31px;height:31px;border-radius:8px;background:rgba(255,255,255,.075);
  display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;
  color:rgba(255,255,255,.80);font-size:11.5px;font-weight:700;transition:.15s}
#railBtns a:hover{background:rgba(247,147,26,.28);color:#fff}
#tip{position:fixed;pointer-events:none;z-index:30;background:rgba(8,8,10,.95);
  border:1px solid rgba(255,255,255,.17);border-radius:10px;padding:9px 12px;font-size:12px;
  display:none;box-shadow:0 10px 30px rgba(0,0,0,.75);min-width:186px}
#tip .td{font-size:10px;letter-spacing:.07em;color:rgba(255,255,255,.52);margin-bottom:5px;text-transform:uppercase}
#tip .tr2{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums;margin-top:2px}
#tip .tr2 b{font-weight:600}

const RAMP=[[0.00,31,63,191],[0.38,46,134,224],[0.72,38,212,196],[1.00,127,233,255]];
function ramp(u){u=Math.max(0,Math.min(1,u));
  for(let i=0;i<RAMP.length-1;i++){const a=RAMP[i],b=RAMP[i+1];
    if(u<=b[0]){const k=(u-a[0])/(b[0]-a[0]||1);
      return [Math.round(a[1]+(b[1]-a[1])*k),Math.round(a[2]+(b[2]-a[2])*k),Math.round(a[3]+(b[3]-a[3])*k)];}}
  return [127,233,255];}
function rgba(c,al){return `rgba(${c[0]},${c[1]},${c[2]},${al})`;}

function ols(xs,ys){let n=xs.length,sx=0,sy=0,sxx=0,sxy=0;
  for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i];}
  const b=(n*sxy-sx*sy)/(n*sxx-sx*sx), a=(sy-b*sx)/n;
  let ssr=0,sst=0,my=sy/n;
  for(let i=0;i<n;i++){const e=ys[i]-(a+b*xs[i]);ssr+=e*e;sst+=(ys[i]-my)*(ys[i]-my);}
  return {a,b,r2:1-ssr/sst,n};}
function sub(arr,idx){return idx.map(i=>arr[i]);}

/* ============================ Modell ============================ */
const M={};
function computeModel(baseEndYear, rollLen){
  const idx=[]; for(let i=0;i<N;i++) if(YR[i]<=baseEndYear) idx.push(i);
  const after=[]; for(let i=0;i<N;i++) if(YR[i]>baseEndYear) after.push(i);
  M.baseEnd=baseEndYear; M.baseIdx=idx; M.lastBase=idx[idx.length-1];
  M.actFit=ols(sub(LA,idx),sub(LMC,idx));
  M.balFit=ols(sub(LB,idx),sub(LMC,idx));
  M.afterFit = after.length>30 ? ols(sub(LA,after),sub(LMC,after)) : null;
  const rl=Math.min(rollLen,N), ridx=[]; for(let i=N-rl;i<N;i++) ridx.push(i);
  M.rollIdx=ridx; M.rollLen=rl; M.rollFit=ols(sub(LA,ridx),sub(LMC,ridx));
  M.rollFitB=ols(sub(LB,ridx),sub(LMC,ridx));
  M.fvAct=[]; M.fvBal=[]; M.dev=[];
  for(let i=0;i<N;i++){
    const fa=Math.exp(M.actFit.a+M.actFit.b*LA[i])/SP[i];
    const fb=Math.exp(M.balFit.a+M.balFit.b*LB[i])/SP[i];
    M.fvAct.push(fa); M.fvBal.push(fb); M.dev.push(Math.log(P[i]/fa));
  }
  M.cur=N-1;
  M.factAct=P[N-1]/M.fvAct[N-1];
  M.factBal=P[N-1]/M.fvBal[N-1];
  M.implied=Math.exp((Math.log(P[N-1]*SP[N-1])-M.actFit.a)/M.actFit.b);
  M.impliedX=M.implied/A[N-1];
  const c=M.dev[N-1]; let hi=0; for(let i=0;i<N;i++) if(M.dev[i]>c) hi++;
  M.devPct=100*hi/N;
  const devB=[]; for(let i=0;i<N;i++) devB.push(Math.log(P[i]/M.fvBal[i]));
  M.devB=devB; const cb=devB[N-1]; let hb=0; for(let i=0;i<N;i++) if(devB[i]>cb) hb++;
  M.devBPct=100*hb/N;
  /* Serie rollierender Betas fuer die Kernaussage */
  let neg=0; for(let i=N-1;i>=rl-1;i--){const w=[];for(let j=i-rl+1;j<=i;j++)w.push(j);
    if(ols(sub(LA,w),sub(LMC,w)).b<0) neg++; else break;}
  M.negRun=neg;
}

/* Der Umschalter tauscht die Rollen: der gewählte Zähler trägt das Hauptmodell,
   der andere läuft als gestrichelte Gegenrechnung mit. Übergang im Log-Raum. */
function fvPrim(i){ const m=S.cntT; return Math.exp(Math.log(M.fvAct[i])*(1-m)+Math.log(M.fvBal[i])*m); }
function fvSec(i){ const m=S.cntT; return Math.exp(Math.log(M.fvBal[i])*(1-m)+Math.log(M.fvAct[i])*m); }
function devPrim(i){ return Math.log(P[i]/fvPrim(i)); }
function primInfo(){ return S.cnt>0.5
  ? {fit:M.balFit, fv:M.fvBal, cnt:B, label:'Adressen mit Guthaben', other:'Aktive Adressen'}
  : {fit:M.actFit, fv:M.fvAct, cnt:A, label:'Aktive Adressen', other:'Adressen mit Guthaben'}; }

function fmtUSD(v){ if(v>=1000) return '$'+Math.round(v).toLocaleString('de-DE');
  if(v>=1) return '$'+v.toFixed(2).replace('.',',');
  return '$'+v.toFixed(4).replace('.',','); }
function fmtN(v,d){return v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtMio(v){return fmtN(v/1e6,2)+' Mio';}

/* ============================ Skalen ============================ */
function layout(){
  const padL=Math.round(S.W*0.062)+30, padR=28;
  const padT=Math.round(S.H*0.118), padB=Math.round(S.H*0.115);
  const gap=Math.round(S.H*0.058);
  const tot=S.H-padT-padB-gap;
  const f=0.60-(0.60-0.24)*S.big;
  const mainH=tot*f, scatH=tot-mainH;
  return {main:{x0:padL,x1:S.W-padR,y0:padT,y1:padT+mainH},
          scat:{x0:padL,x1:S.W-padR,y0:padT+mainH+gap,y1:padT+mainH+gap+scatH}};
}
function visIdx(){const t0=S.view0.getTime();const o=[];for(let i=0;i<N;i++) if(DATE[i].getTime()>=t0) o.push(i);return o;}

function mainScale(R){
  const vi=visIdx();
  const t0=DATE[vi[0]].getTime(), t1=DATE[N-1].getTime();
  const span=t1-t0, tA=t0-span*0.012, tB=t1+span*0.030;
  let lo=1e18, hi=-1e18;
  for(const i of vi){ lo=Math.min(lo,P[i]); hi=Math.max(hi,P[i]);
    const a=fvPrim(i); lo=Math.min(lo,a); hi=Math.max(hi,a);
    if(S.rep){const b=fvSec(i); lo=Math.min(lo,b); hi=Math.max(hi,b);} }
  lo=Math.max(lo*0.55,1); hi=hi*2.0;
  const l0=Math.log(lo), l1=Math.log(hi);
  return {
    x:t=>R.x0+(t-tA)/(tB-tA)*(R.x1-R.x0),
    y:v=>R.y1-(Math.log(Math.max(v,1e-9))-l0)/(l1-l0)*(R.y1-R.y0),
    lo,hi,tA,tB,vi
  };
}
function scatScale(R){
  const m=S.cntT;
  const xv=[]; for(let i=0;i<N;i++) xv.push(LA[i]*(1-m)+LB[i]*m);
  let x0=Math.min(...xv), x1=Math.max(...xv);
  const px=(x1-x0)*0.06; x0-=px; x1+=px;
  let y0=Math.min(...LMC), y1=Math.max(...LMC);
  const py=(y1-y0)*0.07; y0-=py; y1+=py;
  return {xv,
    x:v=>R.x0+(v-x0)/(x1-x0)*(R.x1-R.x0),
    y:v=>R.y1-(v-y0)/(y1-y0)*(R.y1-R.y0),
    x0,x1,y0,y1};
}

/* ============================ Zeichnen ============================ */
function line(pts,col,w,glow,dash,alpha){
  if(pts.length<2) return;
  CX.save(); CX.globalAlpha=alpha==null?1:alpha;
  CX.strokeStyle=col; CX.lineWidth=w; CX.lineJoin='round'; CX.lineCap='round';
  if(dash) CX.setLineDash(dash);
  if(glow){CX.shadowColor=col; CX.shadowBlur=glow;}
  CX.beginPath(); CX.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) CX.lineTo(pts[i][0],pts[i][1]);
  CX.stroke(); CX.restore();
}
function axesMain(R,sc){
  CX.save();
  CX.strokeStyle='rgba(255,255,255,.26)'; CX.lineWidth=1.2;
  CX.beginPath(); CX.moveTo(R.x0,R.y0); CX.lineTo(R.x0,R.y1); CX.lineTo(R.x1,R.y1); CX.stroke();
  const fs=Math.max(13,Math.round(S.H*0.0215));
  CX.font=`600 ${fs}px Inter,Segoe UI,sans-serif`; CX.fillStyle='rgba(255,255,255,.70)';
  CX.textAlign='right'; CX.textBaseline='middle';
  for(let e=-2;e<=7;e++){ const v=Math.pow(10,e); if(v<sc.lo*0.9||v>sc.hi) continue;
    const y=sc.y(v); if(y<R.y0-2||y>R.y1+2) continue;
    CX.strokeStyle='rgba(255,255,255,.075)'; CX.lineWidth=1;
    CX.beginPath(); CX.moveTo(R.x0,y); CX.lineTo(R.x1,y); CX.stroke();
    CX.fillText(fmtUSD(v),R.x0-11,y); }
  CX.textAlign='center'; CX.textBaseline='top';
  const step=S.W<820?4:2;
  const yA=new Date(sc.tA).getUTCFullYear(), yB=new Date(sc.tB).getUTCFullYear();
  for(let y=Math.ceil(yA/step)*step;y<=yB;y+=step){
    const x=sc.x(Date.UTC(y,0,1)); if(x<R.x0-4||x>R.x1) continue;
    CX.fillStyle='rgba(255,255,255,.70)'; CX.fillText(String(y),x,R.y1+11); }
  CX.restore();
}
function bandLayer(R,sc){
  if(!S.band) return;
  const vi=sc.vi, lim=Math.floor(vi.length*S.fvProg); if(lim<2) return;
  CX.save();
  for(let k=0;k<lim-1;k++){
    const i=vi[k], j=vi[k+1];
    const d=(devPrim(i)+devPrim(j))/2, u=Math.max(-1,Math.min(1,d/2.2));
    const c=u>=0?[255,46,99]:[0,229,160];
    const al=Math.min(0.36,Math.abs(u)*0.42);
    if(al<0.012) continue;
    CX.fillStyle=rgba(c,al); CX.beginPath();
    CX.moveTo(sc.x(DATE[i].getTime()),sc.y(P[i]));
    CX.lineTo(sc.x(DATE[j].getTime()),sc.y(P[j]));
    CX.lineTo(sc.x(DATE[j].getTime()),sc.y(fvPrim(j)));
    CX.lineTo(sc.x(DATE[i].getTime()),sc.y(fvPrim(i)));
    CX.closePath(); CX.fill();
  }
  CX.restore();
}
function drawMain(R){
  const sc=mainScale(R);
  axesMain(R,sc);
  bandLayer(R,sc);
  const vi=sc.vi;
  const lim=Math.floor(vi.length*S.fvProg);
  /* Gegenrechnung des ANDEREN Zaehlers zuerst, damit sie hinter dem Hauptmodell liegt */
  if(S.rep){ const rp=[]; for(let k=0;k<lim;k++){const i=vi[k]; rp.push([sc.x(DATE[i].getTime()),sc.y(fvSec(i))]);}
    line(rp,ORANGE,2.2,0,[2,5.5],0.50); }
  /* Hauptmodell (gewaehlter Zaehler): in-sample fest, danach gestrichelt+gedimmt */
  const insP=[],oosP=[];
  for(let k=0;k<lim;k++){const i=vi[k]; const pt=[sc.x(DATE[i].getTime()),sc.y(fvPrim(i))];
    if(i<=M.lastBase) insP.push(pt); else {if(oosP.length===0&&insP.length) oosP.push(insP[insP.length-1]); oosP.push(pt);} }
  line(oosP,ORANGE,2.4,0,[9,7],0.32);
  line(insP,ORANGE,2.7,9,null,1);
  /* Kurs */
  const lp=Math.floor(vi.length*S.priceProg), pp=[];
  for(let k=0;k<lp;k++){const i=vi[k]; pp.push([sc.x(DATE[i].getTime()),sc.y(P[i])]);}
  line(pp,WHITE,3.3,13,null,1);
  if(S.priceProg<1&&pp.length){const q=pp[pp.length-1];
    CX.save(); CX.fillStyle=WHITE; CX.shadowColor=WHITE; CX.shadowBlur=18;
    CX.beginPath(); CX.arc(q[0],q[1],4.2,0,7); CX.fill(); CX.restore();}
  /* HEUTE */
  if(S.priceProg>=1){
    const x=sc.x(DATE[N-1].getTime()), ph=0.5+0.5*Math.sin(performance.now()/900*Math.PI);
    CX.save(); CX.strokeStyle=`rgba(255,255,255,${0.20+0.20*ph})`; CX.lineWidth=1.4; CX.setLineDash([5,6]);
    CX.beginPath(); CX.moveTo(x,R.y0); CX.lineTo(x,R.y1); CX.stroke(); CX.restore();
    const y=sc.y(P[N-1]), pr=0.5+0.5*Math.sin(performance.now()/4000*2*Math.PI);
    CX.save(); CX.strokeStyle=`rgba(255,255,255,${0.45*(1-pr)})`; CX.lineWidth=2;
    CX.beginPath(); CX.arc(x,y,5+13*pr,0,7); CX.stroke();
    CX.fillStyle=WHITE; CX.shadowColor=WHITE; CX.shadowBlur=15; CX.beginPath(); CX.arc(x,y,4.4,0,7); CX.fill(); CX.restore();
    const fs=Math.max(11,Math.round(S.H*0.0165));
    CX.save(); CX.font=`700 ${fs}px Inter,sans-serif`; CX.fillStyle='rgba(255,255,255,.62)';
    CX.textAlign='right'; CX.textBaseline='top'; CX.fillText('HEUTE',x-8,R.y0+5); CX.restore();
  }
  return sc;
}
function drawScatter(R){
  const sc=scatScale(R);
  CX.save();
  CX.strokeStyle='rgba(255,255,255,.26)'; CX.lineWidth=1.2;
  CX.beginPath(); CX.moveTo(R.x0,R.y0); CX.lineTo(R.x0,R.y1); CX.lineTo(R.x1,R.y1); CX.stroke();
  const fs=Math.max(12,Math.round(S.H*0.0195));
  CX.font=`600 ${fs}px Inter,sans-serif`;
  /* x-Ticks: Zehnerpotenzen der Adresszahl */
  CX.textAlign='center'; CX.textBaseline='top'; CX.fillStyle='rgba(255,255,255,.62)';
  for(let e=2;e<=8;e++){ const v=Math.log(Math.pow(10,e)); if(v<sc.x0||v>sc.x1) continue;
    const x=sc.x(v);
    CX.strokeStyle='rgba(255,255,255,.065)'; CX.lineWidth=1;
    CX.beginPath(); CX.moveTo(x,R.y0); CX.lineTo(x,R.y1); CX.stroke();
    const lbl=e>=6?(Math.pow(10,e-6)+' Mio'):Math.pow(10,e).toLocaleString('de-DE');
    CX.fillText(lbl,x,R.y1+9); }
  /* y-Ticks: Marktwert */
  CX.textAlign='right'; CX.textBaseline='middle';
  for(let e=5;e<=13;e++){ const v=Math.log(Math.pow(10,e)); if(v<sc.y0||v>sc.y1) continue;
    const y=sc.y(v); CX.strokeStyle='rgba(255,255,255,.065)'; CX.lineWidth=1;
    CX.beginPath(); CX.moveTo(R.x0,y); CX.lineTo(R.x1,y); CX.stroke();
    const p=Math.pow(10,e); const lbl = p>=1e9?(p/1e9>=1000?(p/1e12)+' Bio':(p/1e9)+' Mrd'):(p/1e6)+' Mio';
    CX.fillStyle='rgba(255,255,255,.62)'; CX.fillText(lbl,R.x0-9,y); }
  CX.restore();
  /* Jahres-Pfad: der Weg des Netzwerks durch den Raum */
  const lim=Math.floor(N*S.dotProg);
  if(lim>2){
    const cen=[]; let cy=YR[0], sx=0, sy=0, cn=0;
    for(let i=0;i<lim;i++){ if(YR[i]!==cy){ if(cn) cen.push([sx/cn,sy/cn,cy]); cy=YR[i]; sx=sy=cn=0; }
      sx+=sc.x(sc.xv[i]); sy+=sc.y(LMC[i]); cn++; }
    if(cn) cen.push([sx/cn,sy/cn,cy]);
    CX.save(); CX.lineWidth=1.7; CX.lineJoin='round'; CX.lineCap='round';
    for(let k=0;k<cen.length-1;k++){
      const u=k/Math.max(1,YR[N-1]-YR[0]);
      CX.strokeStyle=rgba(ramp(u),0.50);
      CX.beginPath(); CX.moveTo(cen[k][0],cen[k][1]); CX.lineTo(cen[k+1][0],cen[k+1][1]); CX.stroke();
    }
    CX.restore();
  }
  /* Punkte chronologisch */
  const rad=Math.max(2.0,S.H*(S.big>0.5?0.0042:0.0030));
  CX.save();
  for(let i=0;i<lim;i++){
    const c=ramp(i/(N-1));
    const fresh=(lim-i)<26 && S.dotProg<1;
    CX.fillStyle=rgba(c,fresh?0.98:0.80);
    if(fresh){CX.shadowColor=rgba(c,1); CX.shadowBlur=13;} else CX.shadowBlur=0;
    CX.beginPath(); CX.arc(sc.x(sc.xv[i]),sc.y(LMC[i]),rad*(fresh?1.5:1),0,7); CX.fill();
  }
  CX.restore();
  /* Geraden */
  if(S.rollProg>0){
    const fA=M.actFit, fB=M.balFit, m=S.cntT;
    const idx=M.baseIdx;
    let xa=1e9,xb=-1e9; for(const i of idx){const v=sc.xv[i]; xa=Math.min(xa,v); xb=Math.max(xb,v);}
    const yA=(x)=> (fA.a+fA.b*x)*(1-m)+(fB.a+fB.b*x)*m;
    const ext=(xb-xa)*0.55;
    line([[sc.x(xb),sc.y(yA(xb))],[sc.x(Math.min(sc.x1,xb+ext)),sc.y(yA(Math.min(sc.x1,xb+ext)))]],ORANGE,2.2,0,[8,7],0.40*S.rollProg);
    line([[sc.x(xa),sc.y(yA(xa))],[sc.x(xb),sc.y(yA(xb))]],ORANGE,2.8,10,null,S.rollProg);
    /* rollierende Gerade in der Farbe der jüngsten Punkte */
    const rc=ramp(1), gA=M.rollFit, gB=M.rollFitB;
    let ra=1e9,rb=-1e9; for(const i of M.rollIdx){const v=sc.xv[i]; ra=Math.min(ra,v); rb=Math.max(rb,v);}
    const yR=(x)=> (gA.a+gA.b*x)*(1-m)+(gB.a+gB.b*x)*m;
    line([[sc.x(ra),sc.y(yR(ra))],[sc.x(rb),sc.y(yR(rb))]],rgba(rc,1),2.6,11,null,S.rollProg);
  }
  /* HEUTE im Streufeld: Abstand zur Basisgeraden ausschreiben */
  if(S.dotProg>=1&&S.rollProg>0){
    const m=S.cntT, i=N-1;
    const xa=sc.xv[i], px=sc.x(xa), py=sc.y(LMC[i]);
    const yFit=(M.actFit.a+M.actFit.b*xa)*(1-m)+(M.balFit.a+M.balFit.b*xa)*m;
    const pf=sc.y(yFit), fac=M.factAct*(1-m)+M.factBal*m;
    CX.save(); CX.globalAlpha=S.rollProg;
    CX.strokeStyle='rgba(255,255,255,.55)'; CX.lineWidth=1.4; CX.setLineDash([4,4]);
    CX.beginPath(); CX.moveTo(px,py); CX.lineTo(px,pf); CX.stroke(); CX.setLineDash([]);
    const pr=0.5+0.5*Math.sin(performance.now()/1250*2*Math.PI);
    CX.strokeStyle=`rgba(255,255,255,${0.30+0.25*pr})`; CX.lineWidth=1.8;
    CX.beginPath(); CX.arc(px,py,rad*2.4,0,7); CX.stroke();
    CX.fillStyle=WHITE; CX.shadowColor=WHITE; CX.shadowBlur=12;
    CX.beginPath(); CX.arc(px,py,rad*1.25,0,7); CX.fill(); CX.shadowBlur=0;
    const fs3=Math.max(12,Math.round(S.H*(S.big>0.5?0.0235:0.0195)));
    CX.font=`900 ${fs3}px Inter,sans-serif`; CX.textBaseline='middle';
    const lbl=fmtN(fac,fac<10?2:1)+'×';
    const w=CX.measureText(lbl).width, lx=px-w-11, ly=(py+pf)/2;
    CX.fillStyle='rgba(0,0,0,.72)';
    CX.beginPath(); CX.roundRect(lx-7,ly-fs3*0.78,w+14,fs3*1.56,6); CX.fill();
    CX.textAlign='left'; CX.fillStyle=fac>1?HOT:COOL; CX.fillText(lbl,lx,ly);
    CX.restore();
  }
  /* Beschriftung der Achsen */
  const fs2=Math.max(11,Math.round(S.H*0.0175));
  CX.save(); CX.font=`700 ${fs2}px Inter,sans-serif`; CX.fillStyle='rgba(255,255,255,.55)';
  CX.textAlign='left'; CX.textBaseline='bottom';
  const lbl=S.cntT<0.5?'AKTIVE ADRESSEN / TAG':'ADRESSEN MIT GUTHABEN';
  CX.fillText(lbl,R.x0+8,R.y1-7);
  CX.textAlign='right'; CX.fillText('MARKTWERT',R.x1-6,R.y0+fs2+4);
  CX.restore();
  return sc;
}

function watermark(){
  /* Zielbreite vorgeben, Schriftgrad daraus ABLEITEN — sonst werden die
     Buchstaben horizontal gestaucht und wirken zu hoch. */
  const target=Math.max(104,S.W*0.082), x=26;
  CX.save(); CX.textBaseline='alphabetic';
  CX.font='900 100px Inter,Segoe UI,sans-serif';
  const n1=CX.measureText('GREAT').width, n2=CX.measureText('WALLY').width;
  const fs=Math.round(target/Math.max(n1,n2)*100);
  CX.font=`900 ${fs}px Inter,Segoe UI,sans-serif`;
  const w1=CX.measureText('GREAT').width, w2=CX.measureText('WALLY').width;
  const lead=fs*0.82, y=S.H-14;
  CX.globalAlpha=0.80;
  CX.save(); CX.translate(x,y-lead); CX.scale(target/w1,1);
  CX.fillStyle='rgba(255,255,255,.92)'; CX.fillText('GREAT',0,0); CX.restore();
  CX.save(); CX.translate(x,y); CX.scale(target/w2,1);
  CX.fillStyle=ORANGE; CX.fillText('WALL',0,0);
  CX.fillStyle='rgba(255,255,255,.92)'; CX.fillText('Y',CX.measureText('WALL').width,0); CX.restore();
  CX.restore();
}

/* ============================ Erklärkasten (Freiflächensuche) ======= */
function proofBox(R,sc){
  if(S.cinema) return;
  const PI=primInfo();
  const lines = S.cnt>0.5 ? [
    ['Zähler', PI.label],
    ['Basis 2010–'+M.baseEnd, 'β = '+fmtN(M.balFit.b,2)+'  ·  R² = '+fmtN(M.balFit.r2,3)+'  ·  n = '+M.balFit.n],
    ['Fairer Wert heute', fmtUSD(M.fvBal[N-1])],
    ['Kurs darüber', fmtN(M.factBal,2)+'×'],
    ['Teurere Wochen', fmtN(M.devBPct,1)+' % von '+N]
  ] : [
    ['Zähler', PI.label],
    ['Basis 2010–'+M.baseEnd, 'β = '+fmtN(M.actFit.b,2)+'  ·  R² = '+fmtN(M.actFit.r2,3)+'  ·  n = '+M.actFit.n],
    ['Danach', M.afterFit? ('β = '+fmtN(M.afterFit.b,2)+'  ·  R² = '+fmtN(M.afterFit.r2,3)) : '—'],
    ['Verlangt heute', fmtMio(M.implied)+' aktive Adressen'],
    ['Gezählt', fmtMio(A[N-1])+'  ('+fmtN(M.impliedX,1)+'× weniger)']
  ];
  const fs=Math.max(11,Math.round(S.H*0.0168));
  CX.save(); CX.font=`600 ${fs}px Inter,sans-serif`;
  let wmax=0; for(const l of lines) wmax=Math.max(wmax, CX.measureText(l[0]).width+18+CX.measureText(l[1]).width);
  const bw=wmax+26, bh=lines.length*(fs*1.55)+20;
  /* Belegungskarte 10px */
  const G=10, gw=Math.ceil(S.W/G), gh=Math.ceil(S.H/G);
  const occ=new Uint8Array(gw*gh);
  const mark=(x,y)=>{const gx=Math.floor(x/G),gy=Math.floor(y/G);
    for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){const X=gx+a,Y=gy+b;
      if(X>=0&&Y>=0&&X<gw&&Y<gh) occ[Y*gw+X]=1;}};
  const vi=sc.vi;
  for(const i of vi){ mark(sc.x(DATE[i].getTime()),sc.y(P[i])); mark(sc.x(DATE[i].getTime()),sc.y(fvPrim(i)));
    if(S.rep) mark(sc.x(DATE[i].getTime()),sc.y(fvSec(i))); }
  /* Bedienfeld sperren */
  const pr=document.getElementById('panel').getBoundingClientRect();
  for(let X=Math.floor(pr.left/G);X<=Math.ceil(pr.right/G);X++)
    for(let Y=Math.floor(pr.top/G);Y<=Math.ceil(pr.bottom/G);Y++)
      if(X>=0&&Y>=0&&X<gw&&Y<gh) occ[Y*gw+X]=1;
  const wish=[R.x1-bw-18, R.y0+(R.y1-R.y0)*0.38];
  let best=null,bd=1e9;
  for(let px=R.x0+14;px<R.x1-bw-8;px+=20)for(let py=R.y0+8;py<R.y1-bh-8;py+=16){
    let free=true;
    for(let X=Math.floor(px/G);X<=Math.ceil((px+bw)/G)&&free;X++)
      for(let Y=Math.floor(py/G);Y<=Math.ceil((py+bh)/G)&&free;Y++)
        if(X>=0&&Y>=0&&X<gw&&Y<gh&&occ[Y*gw+X]) free=false;
    if(free){const d=(px-wish[0])**2+(py-wish[1])**2; if(d<bd){bd=d;best=[px,py];}}
  }
  if(!best){CX.restore();return;}
  const [bx,by]=best;
  CX.fillStyle='rgba(8,8,10,.80)'; CX.strokeStyle='rgba(255,255,255,.13)'; CX.lineWidth=1;
  CX.beginPath(); CX.roundRect(bx,by,bw,bh,10); CX.fill(); CX.stroke();
  CX.textBaseline='middle';
  lines.forEach((l,k)=>{const y=by+14+k*(fs*1.55);
    CX.textAlign='left'; CX.fillStyle='rgba(255,255,255,.48)'; CX.fillText(l[0],bx+13,y);
    CX.textAlign='right'; CX.fillStyle= k===1?ORANGE:'rgba(255,255,255,.90)'; CX.fillText(l[1],bx+bw-13,y);});
  CX.restore();
}

/* ============================ Kino-Overlays ============================ */
let GRAIN=null;
function grainTile(){ if(GRAIN) return GRAIN;
  const c=document.createElement('canvas'); c.width=c.height=180;
  const g=c.getContext('2d'), d=g.createImageData(180,180);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;
    d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=26;}
  g.putImageData(d,0,0); GRAIN=c; return c;}
function overlays(){
  if(S.vign>0){ const g=CX.createRadialGradient(S.W/2,S.H/2,Math.min(S.W,S.H)*0.30,S.W/2,S.H/2,Math.max(S.W,S.H)*0.78);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${0.62*S.vign})`);
    CX.fillStyle=g; CX.fillRect(0,0,S.W,S.H); }
  if(S.grain>0){ CX.save(); CX.globalAlpha=S.grain; CX.globalCompositeOperation='overlay';
    const t=grainTile(); const p=CX.createPattern(t,'repeat');
    CX.fillStyle=p; CX.translate(-(Math.random()*40|0),-(Math.random()*40|0));
    CX.fillRect(0,0,S.W+60,S.H+60); CX.restore(); }
  if(S.bars>0){ const h=S.H*0.12*S.bars; CX.fillStyle='#000';
    CX.fillRect(0,0,S.W,h); CX.fillRect(0,S.H-h,S.W,h); }
  if(S.flash>0){ CX.fillStyle=`rgba(255,255,255,${S.flash})`; CX.fillRect(0,0,S.W,S.H); }
}
function drawMarkup(txt,x,y,fs,align,baseW){
  /* *...* -> orange */
  const parts=txt.split('*'); let tot=0;
  CX.font=`900 ${fs}px Inter,Segoe UI,sans-serif`;
  for(let i=0;i<parts.length;i++) tot+=CX.measureText(parts[i]).width;
  let cx = align==='center'? x-tot/2 : x;
  CX.textAlign='left';
  for(let i=0;i<parts.length;i++){
    CX.fillStyle = (i%2===1)?ORANGE:'rgba(255,255,255,.97)';
    CX.fillText(parts[i],cx,y); cx+=CX.measureText(parts[i]).width;
  }
  return tot;
}
function fullText(txt,alpha,yFrac){
  const raw=txt.split('\n');
  let fs=Math.round(S.H*0.062);
  CX.save();
  for(let g=0;g<40;g++){ CX.font=`900 ${fs}px Inter,sans-serif`;
    let w=0; for(const l of raw) w=Math.max(w,CX.measureText(l.replace(/\*/g,'')).width);
    if(w<S.W*0.80) break; fs=Math.round(fs*0.94); }
  CX.globalAlpha=alpha; CX.textBaseline='middle';
  CX.shadowColor='rgba(0,0,0,.95)'; CX.shadowBlur=22;
  const lh=fs*1.30, y0=S.H*(yFrac==null?0.42:yFrac)-(raw.length-1)*lh/2;
  raw.forEach((l,i)=>drawMarkup(l,S.W/2,y0+i*lh,fs,'center'));
  CX.restore();
}
function banner(label,txt,alpha){

/* ============================ Render ============================ */
function fit(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth, h=window.innerHeight;
  if(S.W!==w||S.H!==h||S.dpr!==dpr||CV.width!==Math.round(w*dpr)){
    S.W=w; S.H=h; S.dpr=dpr;
    CV.width=Math.round(w*dpr); CV.height=Math.round(h*dpr);
    CV.style.width=w+'px'; CV.style.height=h+'px';
  }
}
function render(){
  fit();
  CX.setTransform(S.dpr,0,0,S.dpr,0,0);
  CX.clearRect(0,0,S.W,S.H); CX.fillStyle='#000'; CX.fillRect(0,0,S.W,S.H);
  /* Ziel-Interpolation fuer Umschalter */
  S.cntT+=(S.cnt-S.cntT)*0.10; if(Math.abs(S.cnt-S.cntT)<0.002) S.cntT=S.cnt;
  S.big+=(S.bigT-S.big)*0.10; if(Math.abs(S.bigT-S.big)<0.002) S.big=S.bigT;
  const L=layout();
  CX.save();
  if(S.zoom!==1||S.camY!==0){CX.translate(S.W/2,S.H/2); CX.scale(S.zoom,S.zoom); CX.translate(-S.W/2,-S.H/2+S.camY);}
  let scM=null;
  if(S.scatterOnly<1){ CX.save(); CX.globalAlpha=1-S.scatterOnly; scM=drawMain(L.main); CX.restore(); }
  drawScatter(L.scat);
  CX.restore();
  if(scM && S.dim<0.5) proofBox(L.main,scM);
  if(S.dim>0){CX.fillStyle=`rgba(0,0,0,${S.dim})`; CX.fillRect(0,0,S.W,S.H);}
  watermark();
  overlays();
  if(S.cinema) S.cinema.draw();
  updateTiles();
  requestAnimationFrame(render);
}

const s1=document.getElementById('s1'), s2=document.getElementById('s2');
function recompute(){ computeModel(+s1.value, +s2.value);
  document.getElementById('lb1').textContent=s1.value;
  document.getElementById('lb2').textContent=s2.value+' W'; }
s1.oninput=recompute; s2.oninput=recompute;
document.querySelectorAll('.sw').forEach(el=>{ el.onclick=()=>{
  el.classList.toggle('on'); const on=el.classList.contains('on'), k=el.dataset.k;
  if(k==='band') S.band=on; else if(k==='rep') S.rep=on;
  else if(k==='cnt') S.cnt=on?1:0; else if(k==='big') S.bigT=on?1:0; };});
const panel=document.getElementById('panel'), phead=document.getElementById('phead');
document.getElementById('ptog').onclick=e=>{e.stopPropagation();
  panel.classList.toggle('collapsed');
  document.getElementById('ptog').textContent=panel.classList.contains('collapsed')?'▶':'◀';};
let drag=null;
phead.onmousedown=e=>{drag={x:e.clientX-panel.offsetLeft,y:e.clientY-panel.offsetTop};};
window.addEventListener('mousemove',e=>{ if(drag){panel.style.left=(e.clientX-drag.x)+'px'; panel.style.top=(e.clientY-drag.y)+'px';}});
window.addEventListener('mouseup',()=>drag=null);

/* Share-Rail */
const shareTxt=()=>`Metcalfe bei Bitcoin: Basis 2010–${M.baseEnd} R² ${fmtN(M.actFit.r2,3)}, danach R² ${M.afterFit?fmtN(M.afterFit.r2,3):'—'}. Das Modell verlangt ${fmtMio(M.implied)} aktive Adressen — gezählt werden ${fmtMio(A[N-1])}.`;
document.getElementById('rw').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(shareTxt()+' '+location.href));
document.getElementById('rx').onclick=()=>window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareTxt())+'&url='+encodeURIComponent(location.href));
document.getElementById('rl').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);};

/* Tooltip */
const tip=document.getElementById('tip');
window.addEventListener('mousemove',e=>{
  if(S.cinema){tip.style.display='none';return;}
  const L=layout(), R=L.main;
  if(e.clientX<R.x0||e.clientX>R.x1||e.clientY<R.y0||e.clientY>R.y1){tip.style.display='none';return;}
  const sc=mainScale(R); let best=-1,bd=1e9;
  for(const i of sc.vi){const d=Math.abs(sc.x(DATE[i].getTime())-e.clientX); if(d<bd){bd=d;best=i;}}
  if(best<0){tip.style.display='none';return;}
  const PI=primInfo(), dv=P[best]/PI.fv[best], dvO=P[best]/(PI.label==='Aktive Adressen'?M.fvBal:M.fvAct)[best];
  tip.innerHTML=`<div class="td">${DATE[best].toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})} · ${PI.label}</div>`+
   `<div class="tr2"><span>Kurs</span><b style="color:#fff">${fmtUSD(P[best])}</b></div>`+
   `<div class="tr2"><span>Fairer Wert</span><b style="color:${ORANGE}">${fmtUSD(PI.fv[best])}</b></div>`+
   `<div class="tr2"><span>Abweichung</span><b style="color:${dv>1?HOT:COOL}">${fmtN(dv,dv<10?2:1)}×</b></div>`+
   `<div class="tr2"><span>${PI.label}</span><b style="color:${rgba(ramp(best/(N-1)),1)}">${Math.round(PI.cnt[best]).toLocaleString('de-DE')}</b></div>`+
   (S.rep?`<div class="tr2" style="opacity:.55;border-top:1px solid rgba(255,255,255,.12);margin-top:5px;padding-top:4px">`+
      `<span>${PI.other}</span><b>${fmtN(dvO,dvO<10?2:1)}×</b></div>`:'');
  tip.style.display='block';
  tip.style.left=Math.min(e.clientX+16,S.W-tip.offsetWidth-12)+'px';
  tip.style.top=Math.min(e.clientY+14,S.H-tip.offsetHeight-12)+'px';
});

/* ============================ Kino ============================ */
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function eo(t){return 1-Math.pow(1-t,3);}
function seg(t,a,b){return Math.max(0,Math.min(1,(t-a)/(b-a)));}
function fadeIn(t,a,b,hold){const u=seg(t,a,b); const v=seg(t,b+hold,b+hold+0.45); return Math.min(u,1-v);}

function startCinema(long){
  const DUR = long? 120000 : 40000;
  const t0=performance.now();
  const st={};
  S.cinema={draw(){}};
  const saveBand=S.band, saveRep=S.rep, saveCnt=S.cnt, saveBig=S.bigT;
  function reset(){ S.cinema=null; S.bars=0; S.grain=0; S.flash=0; S.vign=.5; S.zoom=1; S.camY=0;
    S.dim=0; S.dotProg=1; S.priceProg=1; S.fvProg=1; S.rollProg=1; S.scatterOnly=0;
    S.band=saveBand; S.rep=saveRep; S.cnt=saveCnt; S.bigT=saveBig; }
  st.reset=reset;
  const beats=[
    'EIN GESETZ ERKLÄRTE BITCOIN\n*'+M.actFit.n+'* WOCHEN LANG',
    'BESTIMMTHEITSMASS *'+fmtN(M.actFit.r2,2)+'*\nFAST PERFEKT',
    'DANN FIEL ES AUF *'+(M.afterFit?fmtN(M.afterFit.r2,2):'0,02')+'*',
    'DAS MODELL VERLANGT *'+fmtMio(M.implied)+'* NUTZER\nGEZÄHLT WERDEN *'+fmtMio(A[N-1])+'*'
  ];
  const BEAT=3575;
  function frame(now){
    if(!S.cinema) return;
    const t=(now-t0)/DUR*40000;   /* auf 40s-Skala normiert */
    if(now-t0>DUR){ reset(); return; }
    /* Akt 1: Haken 0-14300 */
    if(t<14300){
      S.bars=Math.min(1,t/500); S.vign=.85;
      const bi=Math.min(3,Math.floor(t/BEAT));
      S.grain=bi<2 ? 0.20+0.13*(t/(BEAT*2)) : Math.max(0.05,0.33-0.28*seg(t,BEAT*2,BEAT*2+700));
      S.flash = t>=BEAT*2 && t<BEAT*2+520 ? 0.92*(1-seg(t,BEAT*2,BEAT*2+520)) : 0;
      S.priceProg=0; S.fvProg=0; S.dotProg=0; S.rollProg=0; S.scatterOnly=0; S.dim=0.92; S.rep=false;
      const lt=t-bi*BEAT;
      const al=Math.min(1,lt/380)*(1-seg(lt,BEAT-330,BEAT));
      S.cinema.draw=()=>fullText(beats[bi],al,0.42);
    }
    /* Akt 2: Die Welt 14300-19700 */
    else if(t<19700){
      const u=seg(t,14300,19700);
      S.bars=Math.max(0,1-seg(t,14300,15100)); S.grain=0.05; S.flash=0; S.dim=Math.max(0,0.92*(1-seg(t,14300,14900)));
      S.vign=.62; S.priceProg=eo(seg(t,14500,19100)); S.fvProg=0; S.dotProg=0; S.rollProg=0; S.rep=false;
      S.zoom=1+0.035*u; S.camY=0;
      const al=fadeIn(t,14850,15250,4000);
      S.cinema.draw=()=>banner('BITCOIN-KURS · WOCHENBASIS','*'+N+'* WOCHEN seit Juli *2010* — die volle Historie',al);
    }
    /* Akt 3: Das Modell 19700-24100 */
    else if(t<24100){
      S.bars=0; S.grain=0.05; S.dim=0; S.vign=.60;
      S.priceProg=1; S.fvProg=eo(seg(t,19700,23200)); S.dotProg=0; S.rollProg=0; S.rep=false;
      S.zoom=1.035;
      const al=fadeIn(t,19950,20350,3300);
      S.cinema.draw=()=>banner('METCALFE AUF AKTIVEN ADRESSEN',
        'Basis 2010–'+M.baseEnd+': β *'+fmtN(M.actFit.b,2)+'* · R² *'+fmtN(M.actFit.r2,2)+'* · fairer Wert heute *'+fmtUSD(M.fvAct[N-1])+'*',al);
    }
    /* Akt 4: Kernszene 24100-33100 */
    else if(t<33100){
      S.bars=0; S.grain=0.04; S.dim=0; S.vign=.55;
      S.priceProg=1; S.fvProg=1;
      S.bigT=1; S.big=Math.min(1,S.big+0.06);
      S.zoom=1.035-0.035*seg(t,24100,24900);
      S.dotProg=eo(seg(t,24400,27900));
      S.rollProg=seg(t,27800,28500);
      S.cnt = t>28800 ? 1 : 0; S.rep = t>28800;
      S.scatterOnly=0;
      const al1=fadeIn(t,24400,24800,3400);
      const al2=fadeIn(t,28700,29100,3550);
      S.cinema.draw=()=>{
        if(t<28650) banner('DERSELBE TEST IM STREUFELD','*'+N+'* Wochen — die Gerade der letzten *'+M.rollLen+'* Wochen kippt',al1);
        else banner('ZÄHLER GEWECHSELT','Adressen mit Guthaben: β *'+fmtN(M.balFit.b,2)+'* · R² *'+fmtN(M.balFit.r2,2)+'*',al2);
      };
    }
    /* Akt 5: Urteil 33100-36800 */
    else if(t<36800){
      S.bars=Math.min(1,seg(t,33100,33600)); S.grain=0.05; S.dim=0.80; S.vign=.85;
      S.cnt=1; S.rep=true; S.zoom=1;
      const al=fadeIn(t,33250,33650,2700);
      S.cinema.draw=()=>bigNumber(fmtN(M.impliedX,1)+'×','NUTZER, DIE DER ALTE ZÄHLER NICHT SIEHT',al);
    }
    /* Akt 6: Abspann 36800-40000 */
    else{
      S.bars=Math.max(0,1-seg(t,36800,37300)); S.dim=Math.max(0,0.80*(1-seg(t,36800,37300)));
      S.grain=0.04; S.vign=.55; S.zoom=1; S.cnt=1; S.rep=true; S.bigT=0;
      const al=fadeIn(t,37150,37550,2000);
      S.cinema.draw=()=>banner('REPARIERT: ADRESSEN MIT GUTHABEN',
        'β *'+fmtN(M.balFit.b,2)+'* · R² *'+fmtN(M.balFit.r2,2)+'* · fairer Wert *'+fmtUSD(M.fvBal[N-1])+'* · Kurs *'+fmtN(M.factBal,2)+'×* darüber',al);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return st;
}

/* Langfassung: Erklärer */
function startExplainer(){
  const DUR=120000, t0=performance.now();
  S.cinema={draw(){}};
  const chapters=[
    [0,   'DER AUFBAU', 'Wir testen ein einziges Gesetz:\nDer Wert eines Netzwerks wächst\nmit der Zahl seiner Nutzer'],
    [12,  'DER ZÄHLER', 'Als Nutzerzahl nehmen wir zuerst\ndie aktiven Adressen pro Tag —\nder übliche Onchain-Zähler'],
    [24,  'DIE SCHÄTZUNG','Regression im Log-Raum über\n'+M.actFit.n+' Wochen bis Ende '+M.baseEnd+'\nβ ist der Metcalfe-Exponent'],
    [36,  'DER BRUCH',  'Nach dem Basisfenster verliert\ndas Modell seine Erklärkraft\nvollständig'],
    [50,  'DAS STREUFELD','Jeder Punkt ist eine Woche.\nFrüh liegen sie auf einer Geraden,\nspät biegen sie nach oben ab'],
    [64,  'DIE PROBE',  'Aktive Adressen sind ein Fluss.\nSie messen Bewegung, nicht\ndie Zahl der Besitzer'],
    [78,  'DIE REPARATUR','Derselbe Test mit Adressen,\ndie ein Guthaben halten —\nein Bestand statt eines Flusses'],
    [92,  'DIE GRENZE', 'Beide Fassungen erklären Niveaus,\nnicht Wochenbewegungen.\nKein Zeitwerkzeug'],
    [106, 'DIE PRÜFFRAGE','Misst mein Zähler noch das,\nwas er messen soll —\noder nur noch seinen eigenen Verfall?']
  ];
  function frame(now){
    if(!S.cinema) return;
    const t=(now-t0)/1000;
    if(t>DUR/1000){ S.cinema=null; S.bars=0;S.dim=0;S.grain=0;S.vign=.5; return; }
    S.bars=0.55; S.grain=0.05; S.vign=.70; S.dim=0.55;
    S.priceProg=1; S.fvProg=1; S.dotProg=1; S.rollProg=1;
    let cur=chapters[0];
    for(const c of chapters) if(t>=c[0]) cur=c;
    S.bigT = (t>=50&&t<78)?1:0;
    S.cnt  = (t>=78)?1:0;
    S.rep  = (t>=78);
    const lt=t-cur[0], al=Math.min(1,lt/0.6)*(1-Math.max(0,Math.min(1,(lt-10.4)/0.8)));
    S.cinema.draw=()=>{ banner(cur[1],'',al*0.9); fullText(cur[2],al,0.44); };
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* Tasten */
const keys=new Set();
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.key==='Escape'){ if(S.cinema){S.cinema=null; S.bars=0;S.grain=0;S.flash=0;S.vign=.5;S.zoom=1;
    S.dim=0;S.dotProg=1;S.priceProg=1;S.fvProg=1;S.rollProg=1;S.scatterOnly=0;} return; }
  keys.add(k);
  if(keys.has('s')&&keys.has('t')&&!S.cinema) startCinema(false);
  if(keys.has('a')&&keys.has('r')&&!S.cinema) startExplainer();
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

/* Start */
recompute();
fit();
requestAnimationFrame(render);
</script>
