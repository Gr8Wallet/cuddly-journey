const canvas = document.getElementById('chart');

let dpr = window.devicePixelRatio || 1;
let geom = null;

function resize(){
  dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
  canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener('resize', ()=>{ resize(); draw(); });

let animationActive=false, animationStart=0, sPressed=false, lastS=0;
const easeOut = t => 1 - Math.pow(1-t,3);

function yPrice(price, gTop, gH){
  const ly = Math.log10(Math.max(price, Math.pow(10,MIN_EXP)));
  return gTop + (1 - (Math.min(ly,MAX_EXP) - MIN_EXP)/EXP_RANGE)*gH;
}
function yCycle(v, gTop, gH){ // 0..100 -> bottom..top
  return gTop + (1 - Math.max(0,Math.min(100,v))/100)*gH;
}
function fmt(v){
  if(v==null) return '—';
  if(v>=1000) return '$'+Math.round(v).toLocaleString('en-US');
  if(v>=1) return '$'+v.toFixed(2);
  return '$'+v.toFixed(v<0.01?5:4);
}

function draw(){
  const W = innerWidth, H = innerHeight;
  const isMobile = W < 560;
  const pad = { l: isMobile?64:106, r: isMobile?48:82, t:28, b:70 };
  const gW = W-pad.l-pad.r, gH = H-pad.t-pad.b;
  geom = {pad,gW,gH,W,H};

  let prog = 1;
  if(animationActive){
    const el = Date.now()-animationStart;
    if(el>=30000){ animationActive=false; } else { prog = el/30000; }
  }
  const sub = (a,b)=> prog>=1?1 : prog<=a?0 : prog>=b?1 : (prog-a)/(b-a);
  // CYCLES narrative: Story(0-.14) Axes+Halvings(.14-.24) Price&Realized together(.24-.52) Cycle(.52-.86) TODAY(.86-1)
  const fStory = easeOut(sub(0,0.14));
  const fAxes  = easeOut(sub(0.14,0.24));
  const fPrice = easeOut(sub(0.24,0.52));
  const fReal  = fPrice;                 // price & realized draw together, L->R
  const fCycle = easeOut(sub(0.52,0.86));
  const fToday = easeOut(sub(0.86,1.0));

  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);

  // ---- HALVING markers (bold; in animation they rise slowly from below during the finale) ----
  const showHalv = document.getElementById('tgHalv').checked;
  const halvP = animationActive ? fToday : 1;   // tied to "Der Zyklus schläft nie" phase
  if(showHalv && halvP>0){
    const baseY = pad.t+gH;            // x-axis line
    const fullTickH = gH*0.30;         // taller, but NOT full height
    const tickH = fullTickH*halvP;     // grows upward from the axis
    HALVINGS.forEach(h=>{
      const idx = monthIndex(h.ym); if(idx<0) return;
      const x = pad.l + (idx/(N-1))*gW;
      ctx.save(); ctx.globalAlpha = halvP;
      // bold glowing tick rising from the axis
      const g = ctx.createLinearGradient(0, baseY, 0, baseY-tickH-1);
      g.addColorStop(0,'rgba(247,147,26,0.85)'); g.addColorStop(1,'rgba(247,147,26,0)');
      ctx.strokeStyle=g; ctx.lineWidth=4; ctx.shadowColor='rgba(247,147,26,0.95)'; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.moveTo(x, baseY); ctx.lineTo(x, baseY-tickH); ctx.stroke();
      ctx.shadowBlur=0;
      // bold label rises with the tick
      ctx.fillStyle='#F7931A'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=6;
      ctx.font='bold '+(isMobile?15:20)+'px Arial Black';
      ctx.fillText('⛏ '+h.ym.slice(0,4), x, baseY-tickH-7);
      ctx.restore();
    });
  }

  // ---- gridlines + axes ----
  const axisAlpha = animationActive ? fAxes : 1;
  ctx.save(); ctx.globalAlpha = axisAlpha;
  const tickFont = (isMobile?18:24);
  ctx.font = tickFont+'px Arial Black'; ctx.textBaseline='middle';
  // left = price (log)
  ctx.textAlign='right';
  for(let exp=MIN_EXP; exp<=MAX_EXP; exp++){
    const y = pad.t + (1-(exp-MIN_EXP)/EXP_RANGE)*gH;
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    const v = Math.pow(10,exp);
    let lbl = v>=1e6 ? '$'+(v/1e6)+'M' : (v>=1000 ? '$'+(v/1000)+'k' : (v>=1 ? '$'+v : '$'+v.toFixed(Math.abs(exp))));
    ctx.fillStyle='#fff'; ctx.fillText(lbl, pad.l-9, y);
  }
  // right = cycle (0-100)
  ctx.textAlign='left'; ctx.fillStyle='#F7931A';
  for(let v=0; v<=100; v+=25){
    const y = pad.t + (1-v/100)*gH;
    ctx.fillText(v.toString(), W-pad.r+9, y);
  }
  // X axis year labels
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font=(isMobile?16:21)+'px Arial Black';
  let lastYr=null; const everyN = isMobile?4:2;
  DATA.forEach((d,i)=>{
    const yr = d.d.slice(0,4);
    if(yr!==lastYr && d.d.slice(5,7)==='01' && (+yr)%everyN===0){
      const x = pad.l + (i/(N-1))*gW;
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.beginPath();
      ctx.moveTo(x,pad.t); ctx.lineTo(x,pad.t+gH); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.fillText(yr, x, pad.t+gH+9);
      lastYr=yr;
    }
  });
  ctx.restore();

  const showPrice = document.getElementById('tgPrice').checked;
  const showReal = document.getElementById('tgReal').checked;

  // ---- auto fill between BITCOIN PRICE and REALIZED PRICE (always when both shown) ----
  if(showPrice && showReal){
    const fillN = animationActive ? Math.floor(Math.min(fPrice,fReal)*N) : N;
    if(fillN>1){
      ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#fff';
      ctx.beginPath(); let started=false;
      for(let i=0;i<fillN;i++){ if(DATA[i].r==null) continue;
        const x=pad.l+(i/(N-1))*gW, y=yPrice(DATA[i].p,pad.t,gH);
        if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
      }
      for(let i=fillN-1;i>=0;i--){ if(DATA[i].r==null) continue;
        const x=pad.l+(i/(N-1))*gW, y=yPrice(DATA[i].r,pad.t,gH); ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  // ---- cycle indicators (secondary axis): composite always + one selected component ----
  const cycleN = animationActive ? Math.floor(fCycle*N) : N;
  const selEl = document.querySelector('input[name=cycleSel]:checked');
  const sel = selEl ? selEl.value : 'none';

  // colored fill = the DIFFERENCE between composite and the selected indicator
  if(sel!=='none' && cycleN>1){
    ctx.save(); ctx.globalAlpha=1; ctx.fillStyle='rgba(255,221,128,0.30)';
    ctx.beginPath(); let started=false;
    for(let i=0;i<cycleN;i++){ const a=DATA[i].c.avg, b=DATA[i].c[sel]; if(a==null||b==null) continue;
      const x=pad.l+(i/(N-1))*gW, y=yCycle(a,pad.t,gH);
      if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
    }
    for(let i=cycleN-1;i>=0;i--){ const a=DATA[i].c.avg, b=DATA[i].c[sel]; if(a==null||b==null) continue;
      const x=pad.l+(i/(N-1))*gW, y=yCycle(b,pad.t,gH); ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  CYCLES.filter(s=> s.key==='avg' || s.key===sel).forEach(s=>{
    ctx.save();
    ctx.strokeStyle=s.color; ctx.lineWidth=s.w; ctx.globalAlpha=0.95;
    ctx.shadowColor=s.color; ctx.shadowBlur=s.key==='avg'?12:8;
    ctx.beginPath(); let started=false;
    for(let i=0;i<cycleN;i++){ const v=DATA[i].c[s.key]; if(v==null) continue;
      const x=pad.l+(i/(N-1))*gW, y=yCycle(v,pad.t,gH);
      if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.restore();
  });

  // ---- Realized Price (white, thinner, dashed) ----
  if(showReal){
    const cnt = animationActive ? Math.floor(fReal*N) : N;
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2.6; ctx.setLineDash([7,5]);
    ctx.shadowColor='rgba(255,255,255,0.4)'; ctx.shadowBlur=6;
    ctx.beginPath(); let started=false;
    for(let i=0;i<cnt;i++){ if(DATA[i].r==null) continue;
      const x=pad.l+(i/(N-1))*gW, y=yPrice(DATA[i].r,pad.t,gH);
      if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.restore();
  }

  // ---- Bitcoin Price (white, solid, glow) ----
  if(showPrice){
    const cnt = animationActive ? Math.max(1,Math.floor(fPrice*N)) : N;
    ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=3.4;
    ctx.shadowColor='rgba(255,255,255,0.65)'; ctx.shadowBlur=9;
    ctx.beginPath();
    for(let i=0;i<cnt;i++){
      const x=pad.l+(i/(N-1))*gW, y=yPrice(DATA[i].p,pad.t,gH);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    if(animationActive && fPrice<1 && cnt>0){
      const x=pad.l+((cnt-1)/(N-1))*gW, y=yPrice(DATA[cnt-1].p,pad.t,gH);
      ctx.fillStyle='#fff'; ctx.shadowBlur=18; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
    }
    ctx.restore();
  }

  // ---- TODAY marker ----
  const todayAlpha = animationActive ? fToday : 1;
  if(todayAlpha>0){
    ctx.save(); ctx.globalAlpha=todayAlpha;
    const x = pad.l+gW;
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,pad.t+gH); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }

  // ---- Story overlay (cinematic title sequence) ----
  if(animationActive && fStory>0 && prog<0.16){
    const fade = fStory*Math.min(1,(0.16-prog)/0.05)*0.97;
    // subtle vignette to set the mood
    const vg = ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.2, W/2,H/2, Math.max(W,H)*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,'+(0.6*fade)+')');
    ctx.save(); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H); ctx.restore();
    ctx.save(); ctx.globalAlpha = fade;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(255,255,255,0.9)'; ctx.shadowBlur=54*fStory; ctx.fillStyle='#fff';
    ctx.font='bold '+(isMobile?38:76)+'px Arial Black';
    ctx.fillText('BITCOIN CYCLES', W/2, H/2-(isMobile?44:62));
    ctx.shadowColor='rgba(247,147,26,0.9)'; ctx.shadowBlur=28*fStory; ctx.fillStyle='#F7931A';
    ctx.font='bold '+(isMobile?18:32)+'px Arial Black';
    ctx.fillText('Vier Halvings. Ein Puls.', W/2, H/2+(isMobile?12:18));
    ctx.shadowColor='rgba(255,255,255,0.4)'; ctx.shadowBlur=10; ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.font=(isMobile?14:22)+'px Arial Black';
    ctx.fillText('Lebt er noch?', W/2, H/2+(isMobile?48:66));
    ctx.restore();
  }

  // ---- Cinematic phase captions (narrate what is being built) ----
  if(animationActive){
    const cap = CAPS.find(c=> prog>=c[0] && prog<c[1]);
    if(cap){
      const span=cap[1]-cap[0], lp=(prog-cap[0])/span;
      const cfade = Math.min(1, lp/0.18) * Math.min(1,(1-lp)/0.18);
      if(cfade>0){
        ctx.save(); ctx.globalAlpha=cfade*0.95; ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=8; ctx.fillStyle='#fff';
        ctx.font='bold '+(isMobile?15:23)+'px Arial Black';
        ctx.fillText(cap[2], W/2, pad.t+ (isMobile?34:40));
        ctx.restore();
      }
    }
  }

  // ---- Watermark (GREAT=white, WALL=orange, Y=white) ----
  ctx.save(); ctx.globalAlpha=0.34; ctx.textBaseline='bottom'; ctx.textAlign='left';
  const wmSize=isMobile?16:22; ctx.font='bold '+wmSize+'px Arial Black';
  const segs=[['GREAT ','#fff'],['WALL','#F7931A'],['Y','#fff']];
  let total=0; segs.forEach(s=> total+=ctx.measureText(s[0]).width);
  let wx=W-20-total; const wy=H-6;
  segs.forEach(s=>{ ctx.fillStyle=s[1]; ctx.fillText(s[0],wx,wy); wx+=ctx.measureText(s[0]).width; });
  ctx.restore();

  // panel latest values
  document.getElementById('vPrice').textContent = fmt(DATA[N-1].p);
  document.getElementById('vReal').textContent = fmt(DATA[N-1].r);
  document.getElementById('vAvg').textContent = DATA[N-1].c.avg!=null ? DATA[N-1].c.avg.toFixed(1) : '—';
  document.getElementById('vDate').textContent = DATA[N-1].d;
}

function loop(){ if(animationActive) draw(); requestAnimationFrame(loop); }

// ---- tooltip ----
const tooltip = document.getElementById('tooltip');
canvas.addEventListener('mousemove', e=>{
  if(!geom || animationActive){ tooltip.style.display='none'; return; }
  const {pad,gW} = geom;
  const rel = (e.clientX-pad.l)/gW;
  if(rel<0||rel>1){ tooltip.style.display='none'; return; }
  const i = Math.round(rel*(N-1)); const d = DATA[i];
  document.getElementById('vPrice').textContent = fmt(d.p);
  document.getElementById('vReal').textContent = fmt(d.r);
  document.getElementById('vAvg').textContent = d.c.avg!=null ? d.c.avg.toFixed(1) : '—';
  document.getElementById('vDate').textContent = d.d;
  tooltip.innerHTML = '<b>'+d.d+'</b><br><span style="color:#fff">●</span> Price: '+fmt(d.p)+
    '<br><span style="color:#fff;opacity:0.6">●</span> Realized: '+fmt(d.r)+
    '<br><span style="color:#F7931A">●</span> Cycle: '+(d.c.avg!=null?d.c.avg.toFixed(1):'—');
  tooltip.style.display='block';
  let tx=e.clientX+16, ty=e.clientY+16;
  if(tx+200>innerWidth) tx=e.clientX-200;
  tooltip.style.left=tx+'px'; tooltip.style.top=ty+'px';
});
canvas.addEventListener('mouseleave', ()=> tooltip.style.display='none');

// ---- S+T animation trigger ----
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='s'){ sPressed=true; lastS=Date.now(); }
  else if(k==='t' && sPressed && Date.now()-lastS<500){
    sPressed=false; animationActive=true; animationStart=Date.now(); draw();
  } else if(k!=='s'){ sPressed=false; }
});

// ---- share bar: hidden until edge handle clicked ----
const shareHandle=document.getElementById('shareHandle');
const shareBar=document.getElementById('shareBar');
shareHandle.addEventListener('click', e=>{ e.stopPropagation(); shareBar.classList.toggle('open'); });
document.addEventListener('click', e=>{
  if(!shareBar.contains(e.target) && e.target!==shareHandle) shareBar.classList.remove('open');
});

// ---- collapsible panel ----
const panel=document.getElementById('panel');
document.getElementById('collapseBtn').addEventListener('click', ()=>{
  panel.classList.toggle('collapsed');
  document.getElementById('collapseBtn').innerHTML = panel.classList.contains('collapsed') ? '&#9660;' : '&#9650;';
});

// ---- drag panel ----
const handle=panel.querySelector('.drag-handle');
let drag=false,dx,dy;
handle.addEventListener('mousedown',e=>{
  if(e.target.id==='collapseBtn') return;
  drag=true;dx=e.clientX-panel.offsetLeft;dy=e.clientY-panel.offsetTop;
});
addEventListener('mousemove',e=>{ if(drag){ panel.style.left=Math.max(0,e.clientX-dx)+'px'; panel.style.top=Math.max(0,e.clientY-dy)+'px'; }});
addEventListener('mouseup',()=>drag=false);

// start with intro animation
animationActive=true; animationStart=Date.now(); draw(); loop();
</script>
</body>
</html>
